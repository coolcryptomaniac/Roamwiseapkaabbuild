name: Build RoamWise Android (APK + AAB)
on:
  workflow_dispatch:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with: { node-version: '20' }

      - uses: actions/setup-java@v5
        with: { distribution: 'temurin', java-version: '21' }

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      # ADD THESE THREE LINES: It creates a blank lockfile so npm ci doesn't crash
      
        

      - name: Install dependencies
        run: npm install

      - name: Add Android platform
        run: npx cap add android || true

      - name: Sync web assets into Android project
        run: npx cap sync android

      - name: Generate app icons & splash (real RoamWise icon, not placeholder)
        run: npx @capacitor/assets generate --android --iconBackgroundColor '#07090F' --splashBackgroundColor '#07090F' || true

      - name: Ensure Tailored RoamWise Permissions (Core App Mechanics Only)
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          
          add_perm() {
            local PERM=$1
            grep -q "$PERM" $MANIFEST || \
              sed -i "s#<application#<uses-permission android:name=\"android.permission.$PERM\"/>\n    <application#" $MANIFEST
          }

          # Core Network, Notification & Operation Elements
          add_perm "INTERNET"
          add_perm "ACCESS_NETWORK_STATE"
          add_perm "VIBRATE"
          add_perm "POST_NOTIFICATIONS"

          # Smart Features (Location & Voice Copilot Speech Engine)
          add_perm "ACCESS_FINE_LOCATION"
          add_perm "ACCESS_COARSE_LOCATION"
          add_perm "RECORD_AUDIO"

          # User Media & Journey Cards (Camera + Gallery Storage Links)
          add_perm "CAMERA"
          add_perm "READ_MEDIA_IMAGES"

          echo "---- RoamWise Manifest Verification Complete ----"
          grep -E "permission" $MANIFEST || true


    
      - name: Decode signing keystore
        run: echo "${{ secrets.KEYSTORE_B64 }}" | base64 -d > android/app/rw.keystore

      - name: Configure signing
        run: |
          cat >> android/app/build.gradle <<'GRADLE'

          android {
          compileSdk 36
              defaultConfig {
              targetSdk 36
              minSdk 24
                  versionCode 86
                  versionName "16.9"
              }
              signingConfigs {
                  release {
                      storeFile file('rw.keystore')
                      storePassword 'roamwise2026'
                      keyAlias 'roamwise'
                      keyPassword 'roamwise2026'
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                  }
              }
          }
          GRADLE

      - name: Build signed APK (direct install)
        run: cd android && ./gradlew assembleRelease

      - name: Build signed AAB (Play Store)
        run: cd android && ./gradlew bundleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RoamWise-APK
          path: android/app/build/outputs/apk/release/*.apk

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: RoamWise-AAB
          path: android/app/build/outputs/bundle/release/*.aab
