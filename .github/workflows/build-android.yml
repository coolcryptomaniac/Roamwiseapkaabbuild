name: Build RoamWise Android (fresh APK + AAB)

on:
  workflow_dispatch:
  repository_dispatch:
    types: [ roamwise-main-updated ]
  pull_request:
    branches: [ main ]
  schedule:
    # Safety-net sync/build every 6 hours. repository_dispatch can build immediately.
    - cron: '17 */6 * * *'
  push:
    branches: [ main ]
    # The build bot persists www snapshots; do not recursively rebuild those commits.
    paths-ignore:
      - 'www/**'

permissions:
  contents: write

concurrency:
  group: roamwise-android-${{ github.ref }}
  cancel-in-progress: true

env:
  SOURCE_REPO: coolcryptomaniac/roamwise
  SOURCE_BRANCH: main
  BASE_VERSION_CODE: 1000

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Android build repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout latest RoamWise web app
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ env.SOURCE_BRANCH }}
          path: source-roamwise
          fetch-depth: 1

      - name: Refresh and optimize www from roamwise/main
        shell: bash
        run: |
          set -euo pipefail

          # Resolve main again immediately before copying so every build starts from
          # the newest source commit available, including scheduled/dispatch builds.
          git -C source-roamwise fetch --depth=1 origin "$SOURCE_BRANCH"
          git -C source-roamwise checkout --detach FETCH_HEAD

          mkdir -p www
          rsync -a --delete --delete-excluded \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='node_modules/' \
            --exclude='scripts/' \
            --exclude='tests/' \
            --exclude='test/' \
            --exclude='firestore-rules-history/' \
            --exclude='admin/' \
            --exclude='agent/' \
            --exclude='deck/' \
            --exclude='funding-model/' \
            --exclude='generator/' \
            --exclude='invest/' \
            --exclude='nmims/' \
            --exclude='staff/' \
            --exclude='tools/' \
            --exclude='worker/' \
            --exclude='assets/audio/' \
            --exclude='assets/roamwise-opening.gif' \
            --exclude='assets/roamwise-opening.mp4' \
            --exclude='icons/app-icon-source.png' \
            --exclude='promo.mp4' \
            --exclude='investors-data.js' \
            --exclude='*.md' \
            --exclude='*.txt' \
            --exclude='*.rules' \
            --exclude='*.pdf' \
            --exclude='*.docx' \
            --exclude='*.zip' \
            --exclude='*.apk' \
            --exclude='*.aab' \
            --exclude='package.json' \
            --exclude='package-lock.json' \
            --exclude='wrangler.toml' \
            --exclude='worker.js' \
            source-roamwise/ www/

          node scripts/prepare-android-web.mjs

          SOURCE_SHA=$(git -C source-roamwise rev-parse HEAD)
          printf '{\n  "sourceRepo": "%s",\n  "sourceBranch": "%s",\n  "sourceCommit": "%s"\n}\n' \
            "$SOURCE_REPO" "$SOURCE_BRANCH" "$SOURCE_SHA" > www/roamwise-build-source.json
          echo "ROAMWISE_SOURCE_SHA=$SOURCE_SHA" >> "$GITHUB_ENV"
          rm -rf source-roamwise
          echo "Prepared optimized Android web assets from $SOURCE_REPO@$SOURCE_SHA"

      - name: Enforce Android web asset budget
        shell: bash
        run: |
          set -euo pipefail
          WEB_BYTES=$(find www -type f -printf '%s\n' | awk '{ total += $1 } END { print total + 0 }')
          MAX_WEB_BYTES=$((18 * 1024 * 1024))
          {
            echo "### Android web payload"
            echo ""
            echo "- Source commit: $SOURCE_REPO@$ROAMWISE_SOURCE_SHA"
            echo "- Uncompressed www: $WEB_BYTES bytes"
            echo "- Budget: $MAX_WEB_BYTES bytes"
          } >> "$GITHUB_STEP_SUMMARY"

          if (( WEB_BYTES > MAX_WEB_BYTES )); then
            echo "::error::Optimized www payload is $WEB_BYTES bytes, above the $MAX_WEB_BYTES-byte budget."
            find www -type f -printf '%s %p\n' | sort -nr | sed -n '1,25p'
            exit 1
          fi

          test ! -e www/promo.mp4
          test ! -e www/assets/audio
          test ! -e www/assets/roamwise-opening.gif
          test ! -e www/assets/roamwise-opening.mp4
          test ! -e www/icons/app-icon-source.png
          test ! -e www/admin
          test ! -e www/agent
          test ! -e www/deck
          test ! -e www/invest
          test ! -e www/nmims
          test ! -e www/staff
          test ! -e www/tools
          test ! -e www/worker
          if find www -type f \( -iname '*.pdf' -o -iname '*.docx' -o -iname '*.md' -o -iname '*.rules' \) -print -quit | grep -q .; then
            echo "::error::A non-runtime document survived Android asset pruning."
            exit 1
          fi
          grep -q 'https://www.roamwise.co.in/assets/audio/' www/app.js
          grep -q 'https://www.roamwise.co.in/assets/audio/' www/platform-v5/audio-only.js
          grep -q 'https://www.roamwise.co.in/itinerary-library/' www/itinerary-library/preset-loader.js

      - name: Calculate monotonic Android version
        shell: bash
        run: |
          set -euo pipefail
          VERSION_CODE=$((BASE_VERSION_CODE + GITHUB_RUN_NUMBER))
          VERSION_NAME="18.${GITHUB_RUN_NUMBER}.$(date -u +%Y%m%d)"
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "RoamWise Android versionName=$VERSION_NAME versionCode=$VERSION_CODE"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache Gradle dependencies
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Recreate Android platform
        shell: bash
        run: |
          rm -rf android
          npx cap add android

      - name: Verify native Google authentication plugin
        shell: bash
        run: |
          set -euo pipefail
          test -d node_modules/@capacitor-firebase/authentication
          node -e "const p=require('./package.json'); if(!p.dependencies['@capacitor-firebase/authentication']) process.exit(1)"

      - name: Configure native Firebase for release builds
        shell: bash
        env:
          GOOGLE_SERVICES_JSON_B64: ${{ secrets.GOOGLE_SERVICES_JSON_B64 }}
        run: |
          set -euo pipefail
          if [[ -n "${GOOGLE_SERVICES_JSON_B64:-}" ]]; then
            printf '%s' "$GOOGLE_SERVICES_JSON_B64" | base64 -di > android/app/google-services.json
          elif [[ -f google-services.json ]]; then
            cp google-services.json android/app/google-services.json
          elif [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "::warning::Native Google runtime configuration is not available to this PR build; compilation will still be verified."
            exit 0
          else
            echo "::error::Native Google sign-in needs google-services.json. Add GOOGLE_SERVICES_JSON_B64 as a repository secret or commit the Firebase Android config at the repository root."
            exit 1
          fi
          node - <<'NODE'
          const fs=require('fs');
          const cfg=JSON.parse(fs.readFileSync('android/app/google-services.json','utf8'));
          const clients=Array.isArray(cfg.client)?cfg.client:[];
          const ok=cfg.project_info&&cfg.project_info.project_id==='roamwisepro'&&clients.some(c=>c.client_info&&c.client_info.android_client_info&&c.client_info.android_client_info.package_name==='com.gyanverse.roamwise');
          if(!ok) throw new Error('google-services.json must be from Firebase project roamwisepro for com.gyanverse.roamwise');
          NODE

      - name: Sync refreshed web assets into Android
        run: npx cap sync android

      - name: Generate RoamWise icons and splash
        run: npx @capacitor/assets generate --android --iconBackgroundColor '#07090F' --splashBackgroundColor '#07090F' || true

      - name: Ensure required Android permissions
        shell: bash
        run: |
          set -euo pipefail
          MANIFEST=android/app/src/main/AndroidManifest.xml
          add_perm() {
            local PERM="$1"
            grep -q "android.permission.$PERM" "$MANIFEST" || \
              sed -i "s#<application#<uses-permission android:name=\"android.permission.$PERM\"/>\n    <application#" "$MANIFEST"
          }
          add_perm INTERNET
          add_perm ACCESS_NETWORK_STATE
          add_perm VIBRATE
          add_perm POST_NOTIFICATIONS
          add_perm ACCESS_FINE_LOCATION
          add_perm ACCESS_COARSE_LOCATION
          add_perm RECORD_AUDIO
          add_perm CAMERA
          grep -E "uses-permission" "$MANIFEST" || true

      - name: Decode signing keystore
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_B64" || { echo "KEYSTORE_B64 secret is missing"; exit 1; }
          printf '%s' "$KEYSTORE_B64" | base64 -di > android/app/rw.keystore

      - name: Configure release signing and version
        shell: bash
        run: |
          set -euo pipefail
          cat >> android/app/build.gradle <<GRADLE

          android {
              compileSdk 36
              defaultConfig {
                  targetSdk 36
                  minSdk 24
                  versionCode ${VERSION_CODE}
                  versionName "${VERSION_NAME}"
              }
              signingConfigs {
                  release {
                      storeFile file('rw.keystore')
                      storePassword 'roamwise2026'
                      keyAlias 'roamwise'
                      keyPassword 'roamwise2026'
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                      minifyEnabled true
                      shrinkResources true
                      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                  }
              }
          }
          GRADLE

          # The authentication plugin ships handlers for optional providers. Facebook
          # is intentionally not installed/configured; allow R8 to remove that handler.
          cat >> android/app/proguard-rules.pro <<'RULES'
          -dontwarn com.facebook.**
          RULES

          # Capacitor 8 currently generates an AGP 8.x project. This flag enables
          # the optimized resource shrinker recommended for AGP 8.12/8.13.
          grep -q '^android.r8.optimizedResourceShrinking=true$' android/gradle.properties || \
            echo 'android.r8.optimizedResourceShrinking=true' >> android/gradle.properties

      - name: Build signed APK and AAB
        shell: bash
        run: |
          set -euo pipefail
          cd android
          chmod +x gradlew
          ./gradlew --no-daemon --parallel --build-cache clean assembleRelease bundleRelease

      - name: Verify optimized and signed build outputs
        shell: bash
        run: |
          set -euo pipefail
          APK=$(find android/app/build/outputs/apk/release -name '*.apk' -type f -print -quit)
          AAB=$(find android/app/build/outputs/bundle/release -name '*.aab' -type f -print -quit)
          MAPPING=android/app/build/outputs/mapping/release/mapping.txt
          test -s "$APK"
          test -s "$AAB"
          test -s "$MAPPING"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner -print | sort -V | tail -n 1)
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          jarsigner -verify "$AAB"
          unzip -Z1 "$AAB" | grep -q '^BundleConfig.pb$'
          unzip -Z1 "$AAB" | grep -q '^base/manifest/AndroidManifest.xml$'

          FORBIDDEN='(^|/)assets/public/(promo\.mp4|assets/audio/|assets/roamwise-opening\.(gif|mp4)|icons/app-icon-source\.png|admin/|agent/|deck/|invest/|nmims/|staff/|tools/|worker/)|(^|/)[^/]+\.(pdf|docx|md|rules)$'
          if unzip -Z1 "$APK" | grep -Eiq "$FORBIDDEN"; then
            echo "::error::APK contains assets that must be delivered on demand."
            unzip -Z1 "$APK" | grep -Ei "$FORBIDDEN" | sed -n '1,50p'
            exit 1
          fi
          if unzip -Z1 "$AAB" | grep -Eiq "$FORBIDDEN"; then
            echo "::error::AAB contains assets that must be delivered on demand."
            unzip -Z1 "$AAB" | grep -Ei "$FORBIDDEN" | sed -n '1,50p'
            exit 1
          fi

          APK_BYTES=$(stat -c '%s' "$APK")
          AAB_BYTES=$(stat -c '%s' "$AAB")
          WEB_BYTES=$(find www -type f -printf '%s\n' | awk '{ total += $1 } END { print total + 0 }')
          REPORT=android/app/build/outputs/roamwise-size-report.txt
          {
            echo "source_commit=$ROAMWISE_SOURCE_SHA"
            echo "www_uncompressed_bytes=$WEB_BYTES"
            echo "apk_bytes=$APK_BYTES"
            echo "aab_bytes=$AAB_BYTES"
            echo "r8_minification=true"
            echo "resource_shrinking=true"
            echo "heavy_media_delivery=on-demand"
          } > "$REPORT"
          {
            echo ""
            echo "### Optimized release"
            echo ""
            echo "| Artifact | Bytes |"
            echo "|---|---:|"
            echo "| Android web payload | $WEB_BYTES |"
            echo "| Signed APK | $APK_BYTES |"
            echo "| Signed AAB | $AAB_BYTES |"
            echo ""
            echo "R8 code shrinking and Android resource shrinking are enabled. The AAB keeps Play's default language, density, and ABI configuration splits."
          } >> "$GITHUB_STEP_SUMMARY"
          ls -lh "$APK" "$AAB" "$MAPPING"

      - name: Persist verified www snapshot
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$(git status --porcelain -- www/)" ]]; then
            echo "www already matches optimized $SOURCE_REPO@$ROAMWISE_SOURCE_SHA."
            exit 0
          fi
          git config user.name "roamwise-build-bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add www/
          git commit -m "chore: sync optimized RoamWise web assets [skip ci]"
          git push origin HEAD:main

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RoamWise-${{ env.VERSION_NAME }}-APK
          path: android/app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: RoamWise-${{ env.VERSION_NAME }}-AAB
          path: android/app/build/outputs/bundle/release/*.aab
          retention-days: 30

      - name: Upload R8 mapping and size report
        uses: actions/upload-artifact@v4
        with:
          name: RoamWise-${{ env.VERSION_NAME }}-release-metadata
          path: |
            android/app/build/outputs/mapping/release/mapping.txt
            android/app/build/outputs/roamwise-size-report.txt
          retention-days: 90
          if-no-files-found: error
